[package]
name = "shelltrax"
version = "20251214.0.1"
edition = "2021"
authors = ["Jake Goldsborough <github@pancakes.email>"]
description = "A cmus-inspired terminal music player with Last.fm scrobbling"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ducks/shelltrax"
homepage = "https://github.com/ducks/shelltrax"
readme = "README.md"
keywords = ["music", "player", "tui", "terminal", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
crossterm = "0.28.1"  # For handling terminal I/O
ratatui = { version = "0.29.0", features = ["crossterm"] }       # For building the TUI interface
tokio = { version = "1", features = ["full"] }  # For async support if needed
walkdir = "2.5"
id3 = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
symphonia = { version = "0.5.4", features = ["all"] }
cpal = "0.15"
anyhow = "1"
simplelog = "0.12.1"
log = "0.4"
zip = "2.2"
last-fm-rs = "20251214.0.2"
